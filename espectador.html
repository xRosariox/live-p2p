<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Espectador P2P</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    .player-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #050505; }
    video { width: 100%; height: 100%; object-fit: contain; }

    /* Tela de Interação para Celular (Ignora bloqueio de Autoplay) */
    .play-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(5px); }
    .btn-start-stream { background: #9146ff; color: #fff; border: none; padding: 16px 36px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(145, 70, 255, 0.4); transition: 0.2s; }
    .btn-start-stream:hover { background: #772ce8; transform: scale(1.05); }

    /* Header de Status */
    .header-overlay { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 10px; background: rgba(0, 0, 0, 0.7); padding: 8px 14px; border-radius: 8px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); z-index: 10; }
    .badge-live { background: #eb0400; color: #fff; font-size: 11px; font-weight: bold; padding: 3px 6px; border-radius: 4px; }
    .timer { font-family: monospace; font-size: 13px; color: #adadb8; }

    /* Barra de Controles Customizada (Subiu para evitar a barra do celular) */
    .controls-overlay { position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: rgba(0, 0, 0, 0.85); padding: 8px 16px; border-radius: 30px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); z-index: 10; max-width: 95vw; }
    .btn-control { background: none; border: none; color: #fff; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; opacity: 0.9; padding: 4px; }
    .volume-container { display: flex; align-items: center; }
    input[type="range"] { accent-color: #9146ff; cursor: pointer; width: 60px; }
    @media (min-width: 600px) { input[type="range"] { width: 90px; } .btn-control { font-size: 18px; } .controls-overlay { bottom: 30px; } }
    .divider { width: 1px; height: 16px; background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>

  <div class="player-wrapper">
    <!-- Tela que contorna o bloqueio de reprodução do celular -->
    <div class="play-overlay" id="playOverlay">
      <button class="btn-start-stream" onclick="startStream()">▶️ Entrar na Live</button>
    </div>

    <div class="header-overlay" id="headerInfo">
      <span class="badge-live" id="statusBadge">CONECTANDO</span>
      <span class="timer" id="timer">00:00:00</span>
    </div>

    <video id="remoteVideo" playsinline webkit-playsinline></video>

    <div class="controls-overlay" id="controls">
      <!-- Play / Pause -->
      <button class="btn-control" id="playPauseBtn" onclick="togglePlayPause()" title="Pausar/Play">⏸️</button>

      <div class="divider"></div>

      <!-- Volume e Mute -->
      <button class="btn-control" id="muteBtn" onclick="toggleMute()" title="Volume">🔊</button>
      <div class="volume-container">
        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
      </div>

      <div class="divider"></div>

      <!-- Ocultar Tempo -->
      <button class="btn-control" id="toggleHeaderBtn" onclick="toggleHeader()" title="Ocultar Tempo">👁️</button>

      <!-- Picture in Picture -->
      <button class="btn-control" onclick="togglePiP()" title="PiP">🖼️</button>

      <!-- Tela Cheia -->
      <button class="btn-control" onclick="toggleFullscreen()" title="Tela Cheia">🗖</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');
    const video = document.getElementById('remoteVideo');
    let timerInterval = null;
    let secondsElapsed = 0;

    function startTimer() {
      if(timerInterval) clearInterval(timerInterval);
      secondsElapsed = 0;
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const hrs = String(Math.floor(secondsElapsed / 3600)).padStart(2, '0');
        const mins = String(Math.floor((secondsElapsed % 3600) / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').innerText = `${hrs}:${mins}:${secs}`;
      }, 1000);
    }

    function startStream() {
      document.getElementById('playOverlay').style.display = 'none';
      video.play();
    }

    function togglePlayPause() {
      if (video.paused) {
        video.play();
        document.getElementById('playPauseBtn').innerText = '⏸️';
      } else {
        video.pause();
        document.getElementById('playPauseBtn').innerText = '▶️';
      }
    }

    function changeVolume(val) {
      video.volume = val;
      video.muted = val == 0;
      document.getElementById('muteBtn').innerText = val == 0 ? '🔇' : '🔊';
    }

    function toggleMute() {
      video.muted = !video.muted;
      const slider = document.getElementById('volumeSlider');
      if (video.muted) {
        document.getElementById('muteBtn').innerText = '🔇';
        slider.value = 0;
      } else {
        document.getElementById('muteBtn').innerText = '🔊';
        slider.value = video.volume || 1;
      }
    }

    function toggleHeader() {
      const header = document.getElementById('headerInfo');
      header.style.display = header.style.display === 'none' ? 'flex' : 'none';
    }

    async function togglePiP() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled) {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        console.error("PiP não suportado:", err);
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (video.requestFullscreen) video.requestFullscreen();
        else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen(); // Safari Mobile
        else document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    if (roomId) {
      const peer = new Peer();

      peer.on('open', () => {
        const conn = peer.connect(roomId);
      });

      peer.on('call', (call) => {
        call.answer();
        call.on('stream', (remoteStream) => {
          video.srcObject = remoteStream;
          document.getElementById('statusBadge').innerText = "AO VIVO";
          document.getElementById('statusBadge').style.background = "#eb0400";
          startTimer();

          // Lida com a política rigorosa de autoplay do celular
          let playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {
              // Se o navegador bloquear, mostra o botão gigante de dar play
              document.getElementById('playOverlay').style.display = 'flex';
            });
          }
        });
      });

      peer.on('error', () => {
        document.getElementById('statusBadge').innerText = "OFFLINE";
        document.getElementById('statusBadge').style.background = "#53535f";
      });
    }
  </script>
</body>
</html>
