<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistindo Transmissão P2P</title>

  <!-- Mesma versão do PeerJS usada no transmissor -->
  <!-- Necessário para que transmissor e espectador "falem a mesma língua" -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- Estilos da página do espectador (tela cheia, fundo preto) -->
  <link rel="stylesheet" href="css/espectador.css">
</head>
<body>

  <!-- Card centralizado que contém o player -->
  <div class="video-card">

    <!-- Container do vídeo em proporção 16:9 -->
    <div class="video-container">

      <!-- Overlay de status exibido durante a conexão -->
      <div class="overlay-status" id="statusOverlay">
        Conectando à transmissão...
      </div>

      <!-- Player de vídeo — o botão de fullscreen fica nos controles nativos -->
      <video id="remoteVideo" autoplay playsinline controls></video>

    </div>

  </div>

  <!-- Script do espectador carregado no final do body -->
  <!-- Lê o ?room= da URL e inicia a conexão P2P com o transmissor -->
  <script src="js/espectador.js"></script>
</body>
</html>
