<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistindo Transmissão P2P</title>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/espectador.css">
</head>
<body>

  <div class="page-wrapper">

    <!-- Header acima do player -->
    <header class="stream-header">
      <div class="stream-header-left">
        <!-- Ícone de transmissão -->
        <svg class="stream-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <circle cx="12" cy="20" r="1" fill="currentColor"/>
        </svg>
        <span class="stream-title">Transmissão ao vivo</span>
      </div>
      <div class="stream-header-right">
        <span class="stream-badge" id="streamBadge">Conectando...</span>
      </div>
    </header>

    <!-- Card do player -->
    <div class="video-card">
      <div class="video-container">

        <!-- Overlay de status durante a conexão -->
        <div class="overlay-status" id="statusOverlay">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="overlay-icon spin">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
          <span id="statusText">Conectando à transmissão...</span>
        </div>

        <!-- Player -->
        <video id="remoteVideo" autoplay playsinline controls></video>

      </div>

      <!-- Métricas ficam fora do video-container para não ficarem atrás dos controles nativos do vídeo -->
      <div class="metrics-overlay" id="metricsOverlay">
        <div class="metric-live">
          <span class="live-dot"></span>
          <span class="live-label">AO VIVO</span>
          <span class="live-timer" id="liveTimer">00:00:00</span>
        </div>
        <div class="metric-stats">
          <span class="metric-item" id="metricFps">FPS: --</span>
          <span class="metric-item" id="metricLatency">Latência: --</span>
        </div>
      </div>

      <!-- Botão toggle métricas -->
      <button class="metrics-toggle" id="metricsToggle" title="Ocultar métricas">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </button>

    </div>

    <!-- Rodapé -->
    <footer class="stream-footer">
      <span>Transmissão peer-to-peer &middot; Baixa latência</span>
    </footer>

  </div>

  <script src="js/espectador.js"></script>
</body>
</html>
